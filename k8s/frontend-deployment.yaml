apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-frontend
  namespace: fcg
  labels:
    app: fcg-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fcg-frontend
  template:
    metadata:
      labels:
        app: fcg-frontend
    spec:
      containers:
        - name: fcg-frontend
          image: igoranthony12/fcg-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
